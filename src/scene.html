<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MorphSnos — Scared Cat</title>
<style>
  :root{
    --bg:#0e1621; --panel:#17212b; --panel2:#1d2a35; --panel3:#22303c;
    --in:#182533; --out:#2b5278; --txt:#e9edf1; --dim:#7d8e9e;
    --accent:#51a6e8; --sep:rgba(255,255,255,.055);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{background:#000;overflow:hidden}
  body{width:400px;height:600px}
  #frame{position:relative;width:400px;height:600px;overflow:hidden;background:var(--bg);
    font-family:'Inter','Inter Display',sans-serif;color:var(--txt);letter-spacing:-.01em}
  #shake{position:absolute;inset:0;will-change:transform}

  /* ---------- status bar ---------- */
  .statusbar{position:absolute;top:0;left:0;right:0;height:26px;z-index:60;
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;
    font-size:11.5px;font-weight:600;color:#fff;background:var(--panel)}
  .sb-right{display:flex;align-items:center;gap:5px;opacity:.95}

  .screen{position:absolute;top:26px;left:0;width:400px;height:574px;background:var(--bg);
    overflow:hidden;will-change:transform;box-shadow:-8px 0 24px rgba(0,0,0,.45)}
  .dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50}

  /* ---------- header ---------- */
  .header{position:absolute;top:0;left:0;right:0;height:52px;background:var(--panel);
    display:flex;align-items:center;padding:0 10px;gap:8px;z-index:20;
    border-bottom:1px solid rgba(0,0,0,.25)}
  .hvariant{position:absolute;inset:0;height:52px;display:flex;align-items:center;padding:0 10px;gap:8px}
  .iconbtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:0 0 auto}
  .htitle{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1}
  .hname{font-size:14.5px;font-weight:600;line-height:1.15;white-space:nowrap}
  .hsub{font-size:11.5px;color:var(--dim);line-height:1.3;margin-top:1px;position:relative;height:14px}
  .hsub span{position:absolute;left:0;top:0;white-space:nowrap}
  .hsub .typing{color:var(--accent)}

  .av{border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#fff;overflow:hidden;position:relative}
  .av-q{background:linear-gradient(145deg,#f0785a,#d2453f)}
  .av-bot{background:linear-gradient(145deg,#8e7cff,#4f46c9)}
  .av-ghost{background:linear-gradient(160deg,#7fdc6a,#3fae63)}
  .av-me{background:linear-gradient(150deg,#59c0ff,#2b6fd6)}
  .av-28{width:28px;height:28px;font-size:12px}
  .av-36{width:36px;height:36px;font-size:15px}
  .av-50{width:50px;height:50px;font-size:19px}

  /* ---------- gift showcase ---------- */
  .chips{position:absolute;top:52px;left:0;right:0;height:46px;z-index:18;background:var(--bg);
    display:flex;align-items:center;gap:7px;padding:0 10px;border-bottom:1px solid var(--sep)}
  .chip{display:flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;
    background:var(--panel2);font-size:11.5px;font-weight:600;color:#cfdae4;white-space:nowrap}
  .chip.on{background:#2b5278;color:#fff}
  .gridwrap{position:absolute;top:98px;left:0;right:0;bottom:0;overflow:hidden}
  #grid{position:absolute;left:0;top:0;width:400px;padding:10px;display:flex;flex-wrap:wrap;gap:7px;
    will-change:transform}
  .card{width:122px;height:150px;border-radius:14px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .card .cbg{position:absolute;inset:0}
  .card .pat{position:absolute;inset:0;opacity:.17}
  .card .cat{position:relative;z-index:2;will-change:transform}
  .card .num{position:absolute;top:0;right:0;z-index:4;font-size:8px;font-weight:700;color:rgba(255,255,255,.92);
    background:rgba(0,0,0,.26);padding:3px 5px 3px 9px;border-bottom-left-radius:9px;letter-spacing:.01em}
  .card .price{position:absolute;left:50%;transform:translateX(-50%);bottom:9px;z-index:4;
    display:flex;align-items:center;gap:4px;height:21px;padding:0 8px;border-radius:999px;white-space:nowrap;
    background:rgba(0,0,0,.32);font-size:10.5px;font-weight:700;color:#fff;backdrop-filter:blur(3px)}
  .card .glow{position:absolute;inset:0;border-radius:14px;z-index:5;opacity:0;
    box-shadow:0 0 0 2px #63c2ff inset,0 0 18px rgba(99,194,255,.55);pointer-events:none}
  .card .tapfl{position:absolute;inset:0;background:#fff;opacity:0;z-index:6}

  /* ---------- gift detail sheet ---------- */
  #sheet{position:absolute;z-index:46;border-radius:18px;overflow:hidden;background:var(--panel);
    box-shadow:0 22px 60px rgba(0,0,0,.6);opacity:0;will-change:transform,opacity;
    transform-origin:50% 50%}
  #sheet .hero{position:relative;height:214px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  #sheet .hero .cbg,#sheet .hero .pat{position:absolute;inset:0}
  #sheet .hero .pat{opacity:.17}
  #sheet .body{padding:12px 14px 14px}
  #sheet h2{font-size:16px;font-weight:700;letter-spacing:-.02em}
  #sheet .sub{font-size:11px;color:var(--dim);margin-top:2px}
  #sheet .attrs{margin:11px 0 12px;display:flex;flex-direction:column;gap:7px}
  #sheet .attr{display:flex;align-items:center;justify-content:space-between;font-size:11.5px}
  #sheet .attr .k{color:var(--dim)}
  #sheet .attr .v{font-weight:600;display:flex;align-items:center;gap:6px}
  #sheet .attr .pc{font-size:9.5px;font-weight:700;color:#8fb9dd;background:rgba(81,166,232,.16);
    padding:2px 5px;border-radius:5px}
  .btn{height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:14px;font-weight:700;background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(81,166,232,.3);
    position:relative;overflow:hidden}
  .btn .fl{position:absolute;inset:0;background:#fff;opacity:0}
  .btn.ghostbtn{background:var(--panel3);color:#cfdae4;box-shadow:none}

  /* ---------- modal ---------- */
  #mback{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;z-index:50}
  #modal{position:absolute;left:50px;top:214px;width:300px;z-index:52;background:#1c2733;border-radius:16px;
    padding:18px 18px 14px;opacity:0;will-change:transform,opacity;
    box-shadow:0 26px 60px rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.06)}
  #modal h3{font-size:16.5px;font-weight:700;text-align:center;letter-spacing:-.02em}
  #modal p{font-size:12px;color:var(--dim);text-align:center;margin-top:7px;line-height:1.45}
  #modal .pay{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:9px;
    font-size:15px;font-weight:800;color:#fff}
  #modal .btns{display:flex;gap:9px;margin-top:16px}
  #modal .btns>div{flex:1}

  /* ---------- flying gift + sparks ---------- */
  #flyer{position:absolute;width:62px;height:62px;border-radius:16px;overflow:hidden;z-index:58;opacity:0;
    margin:-31px 0 0 -31px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 26px rgba(0,0,0,.5);will-change:transform,opacity}
  #flyer .cbg{position:absolute;inset:0}
  #sparks{position:absolute;inset:0;z-index:59;pointer-events:none}
  .spark{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;opacity:0;will-change:transform,opacity}
  .spark i{display:block;width:100%;height:100%;background:#ffd977;border-radius:50%;
    box-shadow:0 0 8px rgba(255,214,120,.9)}

  /* ---------- chat body ---------- */
  .wall{position:absolute;top:52px;bottom:56px;left:0;right:0;overflow:hidden;
    background:
      radial-gradient(120% 90% at 85% 0%,rgba(81,166,232,.10),transparent 60%),
      radial-gradient(110% 80% at 0% 100%,rgba(130,90,220,.12),transparent 62%),
      radial-gradient(rgba(255,255,255,.028) 1px,transparent 1.2px) 0 0/22px 22px,
      var(--bg)}
  .msgs{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 12px;
    display:flex;flex-direction:column;align-items:stretch;gap:7px;will-change:transform}
  .pill{align-self:center;background:rgba(0,0,0,.35);color:#cfd9e2;font-size:10.5px;font-weight:500;
    padding:4px 11px;border-radius:999px;margin:3px 0;text-align:center;max-width:300px;line-height:1.35}
  .row{display:flex;width:100%}
  .row.me{justify-content:flex-end}
  .row.them{justify-content:flex-start}
  .bub{max-width:268px;padding:7px 11px 8px;border-radius:14px;font-size:13.5px;line-height:1.34;
    position:relative;display:flex;align-items:flex-end;gap:7px;will-change:transform,opacity;
    box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .bub.them{background:var(--in);border-bottom-left-radius:5px}
  .bub.me{background:var(--out);border-bottom-right-radius:5px}
  .bub .time{font-size:9.5px;color:rgba(255,255,255,.45);flex:0 0 auto;transform:translateY(2px)}
  .bub.me .time{color:rgba(255,255,255,.6)}
  .bub.gift{padding:7px;flex-direction:column;align-items:stretch;gap:0}
  .giftcard{width:142px;border-radius:11px;overflow:hidden;position:relative;background:#0f1a24}
  .giftcard .gbg{position:relative;height:104px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .giftcard .gbg .pat{position:absolute;inset:0;opacity:.16}
  .giftcard .glab{padding:7px 8px 4px;text-align:center}
  .giftcard .glab b{display:block;font-size:11.5px;font-weight:700}
  .giftcard .gprice{display:inline-flex;align-items:center;gap:4px;margin-top:4px;
    font-size:11px;font-weight:700;color:#ffd977}
  .bub.gift .time{align-self:flex-end;margin-top:3px}
  .giftglow{position:absolute;inset:-20px;border-radius:26px;opacity:0;
    background:radial-gradient(circle at 50% 45%,rgba(255,214,120,.45),transparent 65%)}
  .mono{font-variant-ligatures:none}
  .dots{display:flex;align-items:center;gap:4px;height:16px;padding:1px 2px}
  .dots i{width:6px;height:6px;border-radius:50%;background:#8fa3b5;display:block}

  .execrow{display:flex;flex-direction:column;align-items:stretch;gap:0;min-width:168px}
  .execline{display:flex;align-items:center;gap:7px;position:relative;height:18px}
  .execline>span{position:absolute;left:0;top:0;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .spin{width:12px;height:12px;flex:0 0 auto}
  .spin circle{fill:none;stroke:rgba(255,255,255,.22);stroke-width:2}
  .spin path{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
  .pbar{height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}
  .pbar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#51a6e8,#8e7cff)}
  .pct{font-size:9.5px;color:#9fb3c4;margin-top:4px;font-variant-numeric:tabular-nums}

  /* ---------- input bar / keyboard ---------- */
  .botbottom{position:absolute;left:0;right:0;bottom:0;height:236px;z-index:22;will-change:transform}
  .botbottom .inputbar{position:absolute;top:0;bottom:auto}
  .inputbar{position:absolute;left:0;right:0;bottom:0;height:56px;background:var(--panel);
    display:flex;align-items:center;gap:8px;padding:0 10px;z-index:20;border-top:1px solid rgba(0,0,0,.25)}
  .field{flex:1;min-width:0;position:relative;display:flex;align-items:center;height:36px;
    border-radius:18px;background:var(--panel2);padding:0 12px;font-size:13.5px;color:var(--txt);overflow:hidden}
  .field .ph{color:#6f8294;position:absolute;left:12px;top:50%;transform:translateY(-50%)}
  .caret{display:inline-block;width:1.5px;height:16px;background:var(--accent);margin-left:1px;transform:translateY(2px)}
  .send{width:36px;height:36px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 2px 8px rgba(81,166,232,.35)}
  .delbar{position:absolute;left:0;right:0;bottom:0;height:56px;background:var(--panel);z-index:24;
    display:flex;align-items:center;justify-content:center;opacity:0;border-top:1px solid rgba(0,0,0,.25)}
  .delbtn{width:376px;height:44px;border-radius:22px;background:#202e3a;display:flex;align-items:center;
    justify-content:center;font-size:15px;font-weight:700;color:#9fb0bd;position:relative;overflow:hidden;
    border:1px solid rgba(255,255,255,.05)}
  .delbtn .fl{position:absolute;inset:0;background:#fff;opacity:0}
  .kb{position:absolute;top:56px;left:0;right:0;height:180px;background:#1b2530;padding:7px 3px 10px;
    display:flex;flex-direction:column;gap:7px;border-top:1px solid rgba(0,0,0,.35)}
  .kblayer{position:absolute;inset:0;padding:7px 3px 10px;display:flex;flex-direction:column;gap:7px}
  .krow{display:flex;gap:4px;justify-content:center;flex:1;padding:0 3px}
  .key{flex:1;display:flex;align-items:center;justify-content:center;background:#3a4854;border-radius:6px;
    font-size:14px;font-weight:500;color:#eef3f7;box-shadow:0 1px 0 rgba(0,0,0,.45);position:relative}
  .key.fn{background:#2b3843;font-size:11px;color:#c6d3de;flex:0 0 38px}
  .key.sp{flex:4}
  .key .fl{position:absolute;inset:0;border-radius:6px;background:#5a6e7e;opacity:0}

  /* ---------- chat list ---------- */
  .listhead{position:absolute;top:0;left:0;right:0;height:52px;background:var(--panel);
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:20;
    border-bottom:1px solid rgba(0,0,0,.25)}
  .listhead h1{font-size:17px;font-weight:650}
  .rows{position:absolute;top:52px;left:0;right:0;bottom:0}
  .lrow{position:relative;height:70px;display:flex;align-items:center;gap:11px;padding:0 14px}
  .lrow .hl{position:absolute;inset:0;background:#2b5278;opacity:0}
  .lrow .meta{flex:1;min-width:0;position:relative;z-index:2}
  .lrow .top{display:flex;align-items:center;gap:6px}
  .lname{font-size:14.5px;font-weight:600;white-space:nowrap}
  .badge{font-size:8.5px;font-weight:700;letter-spacing:.04em;background:#51a6e8;color:#0e1621;
    padding:1.5px 4px;border-radius:4px;transform:translateY(-.5px)}
  .lmsg{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;max-width:230px}
  .lright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;position:relative;z-index:2}
  .ltime{font-size:10.5px;color:#6f8294}
  .unread{min-width:19px;height:19px;border-radius:999px;background:var(--accent);color:#0e1621;
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .sepline{position:absolute;left:75px;right:0;bottom:0;height:1px;background:var(--sep)}
  .avwrap{position:relative;z-index:2}

  /* ---------- notification banner ---------- */
  #notif{position:absolute;left:10px;top:30px;width:380px;z-index:70;border-radius:16px;padding:10px 12px;
    background:rgba(32,44,56,.94);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);
    box-shadow:0 16px 36px rgba(0,0,0,.55);display:flex;gap:10px;opacity:0;will-change:transform,opacity}
  #notif .ntxt{min-width:0;flex:1}
  #notif .nn{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
  #notif .nn i{font-style:normal;font-size:10px;color:#7d8e9e;font-weight:600}
  #notif .nb{font-size:11.5px;color:#c3d0da;margin-top:3px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ---------- countdown timer ---------- */
  #timer{position:absolute;right:14px;top:112px;width:62px;height:62px;z-index:44;opacity:0;will-change:transform,opacity}
  #timer svg{position:absolute;inset:0}
  #timer .tnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:#ff8373;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  #timer .tglow{position:absolute;inset:-8px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,80,60,.4),transparent 68%);opacity:0}

  /* ---------- subtitles ---------- */
  #capwrap{position:absolute;inset:0;z-index:92;pointer-events:none}
  .capblock{position:absolute;left:50%;width:352px;margin-left:-176px;text-align:center;
    font-family:'Inter Display','Inter',sans-serif;font-weight:800;font-size:22px;line-height:1.3;
    letter-spacing:-.022em;color:#fff;padding:13px 16px 19px;border-radius:19px;
    background:rgba(8,13,19,.56);border:1px solid rgba(255,255,255,.075);
    backdrop-filter:blur(7px) saturate(1.2);
    box-shadow:0 14px 38px rgba(0,0,0,.5),0 2px 0 rgba(255,255,255,.04) inset;
    text-shadow:0 2px 12px rgba(0,0,0,.65);opacity:0;will-change:transform,opacity}
  .capblock.big{font-size:26px;font-weight:900;letter-spacing:-.03em}
  .capblock .w{display:inline-block;margin:0 3.5px;will-change:transform,opacity}
  .capblock .acc{color:#63c2ff;text-shadow:0 0 18px rgba(81,166,232,.45),0 2px 12px rgba(0,0,0,.65)}
  .capblock .dang{color:#ff8373;text-shadow:0 0 18px rgba(255,105,85,.4),0 2px 12px rgba(0,0,0,.65)}
  .capblock .ok{color:#79e09a;text-shadow:0 0 18px rgba(110,220,145,.4),0 2px 12px rgba(0,0,0,.65)}
  .capblock .gold{color:#ffd977;text-shadow:0 0 18px rgba(255,200,90,.45),0 2px 12px rgba(0,0,0,.65)}
  .capblock .bar{position:absolute;left:16px;right:16px;bottom:7px;height:2px;border-radius:2px;
    background:rgba(255,255,255,.1);overflow:hidden}
  .capblock .bar i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#51a6e8,#8e7cff)}

  /* ---------- fx ---------- */
  #ptr{position:absolute;width:42px;height:42px;border-radius:50%;z-index:90;opacity:0;
    margin:-21px 0 0 -21px;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.34),rgba(255,255,255,.16) 62%,rgba(255,255,255,.04) 100%);
    border:1.5px solid rgba(255,255,255,.55);backdrop-filter:blur(1px)}
  #ripple{position:absolute;width:40px;height:40px;border-radius:50%;z-index:89;opacity:0;
    margin:-20px 0 0 -20px;border:2px solid rgba(255,255,255,.85)}
  #vign{position:absolute;inset:0;z-index:86;pointer-events:none;opacity:0;
    box-shadow:inset 0 0 90px 10px rgba(220,40,30,.85)}
  #aura{position:absolute;inset:0;z-index:85;pointer-events:none;opacity:0;
    box-shadow:inset 0 0 70px 6px rgba(90,200,255,.5),inset 0 0 180px 30px rgba(60,120,220,.25)}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:95;pointer-events:none}
  #fade{position:absolute;inset:0;background:#000;opacity:0;z-index:98;pointer-events:none}
</style>
</head>
<body>
<div id="frame">
  <div id="shake">
    <div class="statusbar">
      <div id="clock">21:02</div>
      <div class="sb-right">
        <svg width="15" height="11" viewBox="0 0 15 11"><g fill="#fff"><rect x="0" y="7.5" width="2.4" height="3.5" rx=".6"/><rect x="3.8" y="5.5" width="2.4" height="5.5" rx=".6"/><rect x="7.6" y="3" width="2.4" height="8" rx=".6"/><rect x="11.4" y="0" width="2.4" height="11" rx=".6" opacity=".4"/></g></svg>
        <svg width="14" height="11" viewBox="0 0 14 11"><path d="M7 9.6 1 3.9A8.4 8.4 0 0 1 13 3.9L7 9.6Z" fill="none" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" opacity=".95"/></svg>
        <svg width="22" height="11" viewBox="0 0 22 11"><rect x=".7" y=".7" width="17.6" height="9.6" rx="2.6" fill="none" stroke="#fff" stroke-width="1.2" opacity=".6"/><rect x="2.4" y="2.4" width="11.5" height="6.2" rx="1.4" fill="#fff"/><path d="M20 4v3" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".6"/></svg>
      </div>
    </div>
    <div id="screens"></div>
    <div id="timer"></div>
    <div id="notif"></div>
    <div id="mback"></div>
    <div id="modal"></div>
    <div id="sheet"></div>
    <div id="flyer"></div>
    <div id="sparks"></div>
  </div>
  <div id="capwrap"></div>
  <div id="ripple"></div>
  <div id="ptr"></div>
  <div id="aura"></div>
  <div id="vign"></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>
<script>
/* ===================================================================
   MorphSnos — 5 сцен. Вся анимация — чистая функция window.__render(t).
   =================================================================== */

/* ======================= timeline (seconds) ======================= */
const T = {
  /* --- S1: витрина NFT-подарков --- */

<script>
/* ======================= геометрия, кэш узлов ======================= */
const SC={gift:$('sc_gift'),list:$('sc_list'),dox:$('sc_dox'),bot:$('sc_bot')};
const DIM={gift:$('dim_gift'),list:$('dim_list'),dox:$('dim_dox'),bot:$('dim_bot')};
const CARD_EL=CATS.map((c,i)=>$('card_'+i));
const CAT_EL=CARD_EL.map(e=>e.querySelector('.cat'));
const GLOW_EL=CARD_EL.map(e=>e.querySelector('.glow'));
const TAPFL_EL=CARD_EL.map(e=>e.querySelector('.tapfl'));
const KM={};
['dox','bot'].forEach(w=>{
  KM[w]={};
  document.querySelectorAll('#'+w+'bottom .key[data-ch]').forEach(el=>{
    const c=el.dataset.ch;(KM[w][c]=KM[w][c]||[]).push(el.querySelector('.fl'));
  });
  KM[w].__all=[...document.querySelectorAll('#'+w+'bottom .key .fl')];
});
$('mback').style.zIndex='44';
set($('sheet'),{left:'50px',top:'118px',width:'300px'});
set($('modal'),{top:'214px'});
const SH_W=300, SH_H=$('sheet').offsetHeight;
const RECT=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};
const P_BUY=RECT($('buybtn')), P_YES=RECT($('btn_yes'));
const PICK_COL=PICK%3, PICK_ROW=(PICK/3)|0;
const AV_TARGET={x:370,y:52};

/* ---- скролл витрины ---- */
function scrollY(t){
  let y=0;
  y+=lerp(0,-150,eOut(k(t,T.scrollA,T.scrollAe)));
  y+=lerp(0,58,eOut(k(t,T.scrollB,T.scrollBe)));
  return y;
}
/* положение выбранной карточки в координатах кадра */
function cardPos(t){
  return {x:PAD+PICK_COL*(CARD_W+GAP), y:26+GRID_TOP+PAD+PICK_ROW*(CARD_H+GAP)+scrollY(t)};
}

/* ======================= пузыри ======================= */
function bubbleIn(rowEl,t,t0){
  if(t0===undefined||t<t0-0.001){set(rowEl,{display:'none',opacity:'0'});return 0}
  set(rowEl,{display:rowEl.classList.contains('pill')?'block':'flex'});
  const p=k(t,t0,t0+0.34), e=eBack(p);
  const b=rowEl.firstElementChild||rowEl;
  set(rowEl,{opacity:String(clamp(k(t,t0,t0+0.18)))});
  if(b!==rowEl) set(b,{transform:`translateY(${lerp(10,0,eOut(p)).toFixed(2)}px) scale(${lerp(.86,1,e).toFixed(4)})`,
    transformOrigin: rowEl.classList.contains('me')?'100% 100%':'0% 100%'});
  return 1;
}
function showTyping(rowEl,t,t0,t1){
  if(t<t0||t>=t1){set(rowEl,{display:'none',opacity:'0'});return}
  set(rowEl,{display:'flex'});
  bubbleIn(rowEl,t,t0);
  const fo=k(t,t1-0.14,t1);
  set(rowEl,{opacity:String(clamp(k(t,t0,t0+0.18))*(1-fo))});
  rowEl.querySelectorAll('.dots i').forEach((d,i)=>{
    const ph=((t-t0)*1.45-i*0.17)%1;
    const s=0.62+0.38*Math.max(0,Math.sin(Math.PI*clamp(ph*1.6)));
    d.style.transform=`scale(${s.toFixed(3)})`;
    d.style.opacity=(0.45+0.55*(s-0.62)/0.38).toFixed(3);
  });
}
function renderMsgs(list,idp,t){
  list.forEach((m,i)=>{
    const el=$(`${idp}_${i}`);
    if(m.k==='typing'){showTyping(el,t,T[m.t0],T[m.t1]);return}
    const t0 = m.t===undefined?-1:(typeof m.t==='number'?m.t:T[m.t]);
    bubbleIn(el,t,t0<0?-1:t0);
    if(m.k==='gift'){
      const g=el.querySelector('.giftglow');
      const p=clamp(1-Math.abs(t-(t0+0.18))/0.8);
      g.style.opacity=(p*0.85).toFixed(3);
    }
  });
}

/* ======================= печать в поле ввода ======================= */
const PH_DOX=[{a:T.qA,b:T.qB,s:T.sendQ,txt:'ты кто?'},
              {a:T.okA,b:T.okB,s:T.sendOk,txt:'хорошо, хорошо. Щас отправлю подарок'},
              {a:T.noA,b:T.noB,s:T.sendNo,txt:'черт, у меня нету звёзд на передачу'}];
const PH_BOT=[{a:T.uA,b:T.uB,s:T.sendU,txt:'@doxsv_tbog'}];
function renderTyping(w,phases,t,kbOpen){
  const typed=$(w+'_typed'), ph=$(w+'_ph'), caret=$(w+'_caret'), send=$(w+'_send');
  let cur=null; for(const p of phases) if(t>=p.a-0.25) cur=p;
  let txt='';
  if(cur && t<cur.s) txt=cur.txt.slice(0,Math.round(k(t,cur.a,cur.b)*cur.txt.length));
  typed.textContent=txt;
  const over=Math.max(0,typed.scrollWidth-232);
  typed.style.transform=`translateX(${-over}px)`;
  ph.style.opacity=txt.length?'0':'1';
  caret.style.opacity=(kbOpen&&((t*1.7)%1)<0.55)?'1':'0';
  const vis=txt.length?1:0;
  const pressT=cur?cur.s-0.08:-9;
  const press=clamp(1-Math.abs(t-pressT)/0.16);
  set(send,{opacity:vis?'1':'0',transform:`scale(${(1-0.14*press).toFixed(3)})`});
  KM[w].__all.forEach(e=>e.style.opacity='0');
  if(cur && t>=cur.a && t<cur.s){
    const L=cur.txt.length;
    for(let i=0;i<L;i++){
      const ti=cur.a+((i+1)/L)*(cur.b-cur.a)-0.03;
      const a=clamp(1-Math.abs(t-ti)/0.11);
      if(a<=0) continue;
      (KM[w][cur.txt[i].toLowerCase()]||[]).forEach(el=>{el.style.opacity=(a*.9).toFixed(3)});
    }
  }
}

/* ======================= тапы ======================= */
const TAPS=[
  {t:T.tapCat,  x:200, y:274, hold:null},
  {t:T.tapBuy,  x:P_BUY.x, y:P_BUY.y, hold:null, btn:'buybtn'},
  {t:T.tapYes,  x:P_YES.x, y:P_YES.y, hold:null, btn:'btn_yes'},
  {t:T.tapNotif,x:200, y:62,  hold:null},
  {t:T.sendQ-0.08, x:372,y:392},
  {t:T.sendOk-0.08,x:372,y:392},
  {t:T.sendNo-0.08,x:372,y:392},
  {t:T.tapBack1,x:27, y:52,  hold:null},
  {t:T.tapBot,  x:300,y:183, hold:'row_bot'},
  {t:T.tapSend, x:372,y:392},
  {t:T.tapBack2,x:27, y:52,  hold:null},
  {t:T.tapDox,  x:300,y:113, hold:'row_doxer'}
];
const HOLDS=['row_bot','row_doxer'];

/* ======================= основной рендер ======================= */
function render(t){
  /* ---------- навигация ---------- */
  const pos={gift:120,list:120,dox:120,bot:120};
  let idx=-1; for(let i=0;i<NAV.length;i++) if(t>=NAV[i].t) idx=i;
  for(const key in pos) DIM[key].style.opacity='0';
  if(idx<0){pos[START_SCREEN]=0}
  else{
    const n=NAV[idx], p=eOut4(k(t,n.t,n.t+NAVDUR));
    if(n.dir==='push'){pos[n.from]=-25*p;pos[n.to]=100*(1-p);DIM[n.from].style.opacity=(0.35*p).toFixed(3)}
    else{pos[n.from]=100*p;pos[n.to]=-25*(1-p);DIM[n.to].style.opacity=(0.35*(1-p)).toFixed(3)}
  }
  for(const key in pos){
    const off=pos[key];
    set(SC[key],{transform:`translateX(${(off*4).toFixed(2)}px)`,visibility:off>=119?'hidden':'visible'});
  }
  /* плавная позиция таймера: в списке — снизу справа, в чатах — у шапки */
  let listness=0;
  if(idx<0) listness=0;
  else{
    const n=NAV[idx], p=eOut4(k(t,n.t,n.t+NAVDUR));
    const a=n.from==='list'?1:0, b=n.to==='list'?1:0;
    listness=lerp(a,b,p);
  }

  /* ================= СЦЕНА 1 — витрина ================= */
  const sy=scrollY(t);
  set($('grid'),{transform:`translateY(${sy.toFixed(2)}px)`});
  CAT_EL.forEach((el,i)=>{
    const ph=i*0.73, sw=Math.sin(t*1.7+ph), bob=Math.sin(t*2.3+ph*1.3);
    set(el,{transform:`rotate(${(sw*2.6).toFixed(2)}deg) translateY(${(bob*1.6).toFixed(2)}px)`,
            transformOrigin:'50% 85%'});
  });
  GLOW_EL.forEach((g,i)=>{
    if(i!==PICK){g.style.opacity='0';return}
    const on=k(t,T.hl,T.hl+0.3)*(1-k(t,T.sheetIn,T.sheetIn+0.2));
    const pulse=0.55+0.45*Math.sin((t-T.hl)*5.2);
    g.style.opacity=(on*(0.6+0.4*pulse)).toFixed(3);
  });
  TAPFL_EL.forEach((f,i)=>{f.style.opacity=(i===PICK?0.22*clamp(1-Math.abs(t-T.tapCat)/0.2):0).toFixed(3)});

  /* --- карточка подарка --- */
  const shIn=k(t,T.sheetIn,T.sheetIn+0.52);
  const shOut=k(t,T.fly,T.fly+0.3);
  const cp=cardPos(T.tapCat);
  const sOpen=eOut(shIn)*(1-eOut(shOut));
  const sc0=CARD_W/SH_W, scv=lerp(sc0,1,eOut(shIn))*lerp(1,0.92,eOut(shOut));
  const tx=lerp(cp.x+CARD_W/2-(50+SH_W/2),0,eOut(shIn));
  const ty=lerp(cp.y+CARD_H/2-(118+SH_H/2),0,eOut(shIn));
  set($('sheet'),{opacity:(clamp(shIn*2.2)*(1-shOut)).toFixed(3),
    transform:`translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${scv.toFixed(4)})`,
    visibility:(shIn>0&&shOut<1)?'visible':'hidden'});
  const sheetCat=$('sheetcat');
  set(sheetCat,{transform:`rotate(${(Math.sin(t*1.5)*2.2).toFixed(2)}deg) translateY(${(Math.sin(t*2.1)*2).toFixed(2)}px)`,transformOrigin:'50% 85%'});
  set($('buybtn').querySelector('.fl'),{opacity:(0.3*clamp(1-Math.abs(t-T.tapBuy)/0.18)).toFixed(3)});

  /* --- модалка --- */
  const mIn=k(t,T.modalIn,T.modalIn+0.3), mOut=k(t,T.modalOut,T.modalOut+0.26);
  const mv=mIn*(1-mOut);
  set($('modal'),{opacity:mv.toFixed(3),visibility:mv>0.001?'visible':'hidden',
    transform:`translateY(${lerp(16,0,eBack(mIn)).toFixed(2)}px) scale(${(lerp(.92,1,eBack(mIn))*lerp(1,.96,mOut)).toFixed(4)})`});
  set($('btn_yes').querySelector('.fl'),{opacity:(0.32*clamp(1-Math.abs(t-T.tapYes)/0.18)).toFixed(3)});
  const back=Math.max(clamp(shIn*1.6)*(1-shOut)*0.55, mv*0.74);
  set($('mback'),{opacity:back.toFixed(3),visibility:back>0.002?'visible':'hidden',zIndex:mv>0.02?'51':'44'});

  /* --- полёт подарка в профиль --- */
  const fp=k(t,T.fly,T.flyEnd);
  const flying=t>=T.fly&&t<=T.flyEnd+0.1;
  if(flying){
    const e=eInOut(fp);
    const p0={x:200,y:118+107}, p2=AV_TARGET, p1={x:318,y:96};
    const bx=(1-e)*(1-e)*p0.x+2*(1-e)*e*p1.x+e*e*p2.x;
    const by=(1-e)*(1-e)*p0.y+2*(1-e)*e*p1.y+e*e*p2.y;
    const s=lerp(1,0.26,eInOut(fp)), spin=lerp(0,22,eOut(fp));
    set($('flyer'),{opacity:String(clamp(k(t,T.fly,T.fly+0.12))*(1-k(t,T.flyEnd-0.08,T.flyEnd))),
      left:bx.toFixed(1)+'px',top:by.toFixed(1)+'px',
      transform:`scale(${s.toFixed(3)}) rotate(${spin.toFixed(1)}deg)`});
  } else set($('flyer'),{opacity:'0'});
  SPARKS.forEach((el,i)=>{
    const born=T.fly+0.05+rnd(i)*0.82, life=0.5+rnd(i+40)*0.35;
    const p=k(t,born,born+life);
    if(p<=0||p>=1||t>T.flyEnd+0.9){el.style.opacity='0';return}
    const e0=eInOut(clamp((born-T.fly)/(T.flyEnd-T.fly)));
    const p0={x:200,y:225}, p2=AV_TARGET, p1={x:318,y:96};
    const bx=(1-e0)*(1-e0)*p0.x+2*(1-e0)*e0*p1.x+e0*e0*p2.x;
    const by=(1-e0)*(1-e0)*p0.y+2*(1-e0)*e0*p1.y+e0*e0*p2.y;
    const ang=rnd(i+7)*6.283, dist=lerp(4,26+rnd(i+13)*22,eOut(p));
    el.style.left=(bx+Math.cos(ang)*dist).toFixed(1)+'px';
    el.style.top=(by+Math.sin(ang)*dist+p*p*14).toFixed(1)+'px';
    el.style.opacity=((1-p)*(1-p)*0.95).toFixed(3);
    el.style.transform=`scale(${lerp(1.25,0.25,p).toFixed(3)})`;
  });
  /* всплеск на аватаре профиля */
  const pop=clamp(1-Math.abs(t-T.avPop)/0.42);
  set($('profav'),{transform:`scale(${(1+0.3*Math.sin(Math.PI*pop)).toFixed(4)})`});
  set($('avring'),{opacity:(pop*0.95).toFixed(3),transform:`scale(${lerp(.75,1.5,1-pop).toFixed(3)})`});

  /* ================= таймер ================= */
  const tvis=k(t,T.timerOn,T.timerOn+0.45)*(1-k(t,T.botDone+0.35,T.botDone+0.95));
  const rem=Math.max(0,180-(Math.min(t,T.botDone)-T.timerOn)*5.6);
  const mm=Math.floor(rem/60), ss=Math.floor(rem%60);
  $('tnum').textContent=`${mm}:${ss<10?'0':''}${ss}`;
  $('tring').setAttribute('stroke-dashoffset',(163.4*(1-rem/180)).toFixed(1));
  const hot=rem<70?clamp((70-rem)/40):0;
  const beat=0.5+0.5*Math.sin(t*7.5);
  set($('timer'),{opacity:tvis.toFixed(3),top:lerp(30,470,listness).toFixed(1)+'px',
    transform:`scale(${(lerp(.7,1,eBack(k(t,T.timerOn,T.timerOn+0.45)))*(1+0.05*hot*beat)).toFixed(4)})`});
  set($('tglow'),{opacity:(hot*(0.35+0.4*beat)).toFixed(3)});
  $('tnum').style.color=rem<70?'#ff6a52':'#ff8373';

  /* ================= уведомление ================= */
  const nIn=k(t,T.notifIn,T.notifIn+0.4), nOut=k(t,T.tapNotif,T.tapNotif+0.3);
  const nv=nIn*(1-nOut);
  const npress=clamp(1-Math.abs(t-T.tapNotif)/0.16);
  set($('notif'),{opacity:nv.toFixed(3),visibility:nv>0.002?'visible':'hidden',
    transform:`translateY(${lerp(-90,0,eOut(nIn)).toFixed(1)}px) scale(${(lerp(.94,1,eBack(nIn))*(1-0.03*npress)).toFixed(4)})`});

  /* ================= список чатов ================= */
  const rowIn=k(t,T.notifIn+0.1,T.notifIn+0.5);
  set($('restrows'),{transform:`translateY(${(70*eOut(rowIn)).toFixed(2)}px)`});
  set($('row_doxer'),{opacity:rowIn.toFixed(3)});
  $('row_dox_unread').style.opacity=t<T.navDox1?'1':'0';
  const gh=k(t,T.ghost,T.ghost+0.55);
  $('row_dox_av').style.opacity=(1-k(t,T.ghost,T.ghost+0.3)).toFixed(3);
  $('row_dox_gh').style.opacity=k(t,T.ghost+0.26,T.ghost+0.6).toFixed(3);
  $('row_dox_name').textContent=t>=T.nameChg?'Удалённый аккаунт':'doxsv#tbog';
  $('row_dox_name').style.color=t>=T.nameChg?'#aebecb':'';
  $('row_dox_msg').textContent=t>=T.nameChg?'аккаунт удалён':'здарова, на тебя заказали докс…';
  $('row_bot_msg').textContent=t>=T.botDone?'готово':'Пришлите @username';

  /* ================= чат с доксером ================= */
  $('hdr_alive').style.opacity=(1-k(t,T.ghost,T.ghost+0.3)).toFixed(3);
  $('hdr_dead').style.opacity=k(t,T.ghost+0.26,T.ghost+0.6).toFixed(3);
  set($('hdr_dead').querySelector('.htitle'),{transform:`translateY(${lerp(7,0,eOut(gh)).toFixed(2)}px)`});
  set($('dox_av'),{filter:`blur(${(gh*5).toFixed(2)}px)`,transform:`scale(${lerp(1,1.25,gh).toFixed(3)})`});
  let dtyping=0;
  [[T.d1type,T.d1],[T.d2type,T.d2],[T.d3type,T.d3],[T.d4type,T.gift1]].forEach(([a,b])=>{
    dtyping=Math.max(dtyping,k(t,a,a+0.18)*(1-k(t,b-0.12,b)));
  });
  $('dox_typing').style.opacity=(dtyping*(1-gh)).toFixed(3);
  $('dox_seen').style.opacity=((1-dtyping)*(1-gh)).toFixed(3);
  renderMsgs(DOX,'dox',t);

  const kbDox=eOut(clamp(k(t,T.kbOn,T.kbOn+0.34)-k(t,T.kbOff,T.kbOff+0.30)));
  set($('doxbottom'),{transform:`translateY(${(180*(1-kbDox)).toFixed(2)}px)`});
  set($('dox_wall'),{bottom:(56+180*kbDox).toFixed(1)+'px'});
  renderTyping('dox',PH_DOX,t,kbDox>0.5);
  const dbar=k(t,T.delBtn,T.delBtn+0.4);
  set($('delbar'),{opacity:dbar.toFixed(3)});
  set($('delbtn'),{transform:`translateY(${lerp(14,0,eOut(dbar)).toFixed(2)}px) scale(${lerp(.96,1,eBack(dbar)).toFixed(4)})`});

  /* ================= чат с ботом ================= */
  const kbBot=eOut(clamp(k(t,T.focusBot,T.focusBot+0.34)-k(t,T.kbHide,T.kbHide+0.30)));
  set($('botbottom'),{transform:`translateY(${(180*(1-kbBot)).toFixed(2)}px)`});
  set($('bot_wall'),{bottom:(56+180*kbBot).toFixed(1)+'px'});
  renderTyping('bot',PH_BOT,t,kbBot>0.5);
  renderMsgs(BOTMSG,'bot',t);
  const prog=k(t,T.botExec+0.12,T.botDone);
  $('pbar').style.width=(100*prog).toFixed(1)+'%';
  $('pct').textContent=Math.round(prog*100)+'%';
  const done=k(t,T.botDone,T.botDone+0.34);
  $('lbl_exec').style.opacity=(1-clamp(done*1.6)).toFixed(3);
  set($('lbl_exec'),{transform:`translateY(${(-5*done).toFixed(2)}px)`});
  $('lbl_done').style.opacity=clamp(k(t,T.botDone+0.1,T.botDone+0.4)).toFixed(3);
  set($('lbl_done'),{transform:`translateY(${lerp(6,0,eOut(k(t,T.botDone+0.1,T.botDone+0.45))).toFixed(2)}px)`});
  $('pbar_w').style.opacity=(1-done).toFixed(3);
  $('pct').style.opacity=(1-done).toFixed(3);
  $('exectext').textContent='выполняю'+'.'.repeat(Math.floor(Math.max(0,t-T.botExec)*2)%3+1);
  set($('spin'),{transform:`rotate(${((t-T.botExec)*420%360).toFixed(1)}deg)`,transformOrigin:'50% 50%'});
  if(t>=T.botDone){
    const pp=clamp(k(t,T.botDone,T.botDone+0.3));
    set($('bot_msgs').lastElementChild.firstElementChild,{transform:`scale(${(1+0.05*Math.sin(Math.PI*pp)).toFixed(4)})`,transformOrigin:'0% 100%'});
  }

  /* ================= указатель и тапы ================= */
  HOLDS.forEach(id=>{const h=$(id).querySelector('.hl'); if(h)h.style.opacity='0'});
  let px=0,py=0,op=0,psc=1,rip=0,ripOp=0;
  /* жесты скролла */
  const g1=k(t,T.scrollA,T.scrollAe), g2=k(t,T.scrollB,T.scrollBe);
  if(t>=T.scrollA-0.35&&t<=T.scrollBe+0.35){
    px=252; py=lerp(430,296,eOut(g1))+lerp(0,52,eOut(g2));
    op=k(t,T.scrollA-0.35,T.scrollA-0.1)*(1-k(t,T.scrollBe+0.1,T.scrollBe+0.35));
    psc=1;
  }
  for(let i=0;i<TAPS.length;i++){
    const tap=TAPS[i], prev=TAPS[i-1];
    const appear=tap.t-0.6, gone=tap.t+0.42;
    if(t<appear||t>gone+0.1) continue;
    const from = prev && (tap.t-prev.t)<1.7 ? {x:prev.x,y:prev.y} : {x:tap.x+(tap.x>200?-72:72),y:Math.min(tap.y+108,544)};
    const mp=eInOut(k(t,appear,tap.t-0.06));
    px=lerp(from.x,tap.x,mp); py=lerp(from.y,tap.y,mp);
    op=k(t,appear,appear+0.18)*(1-k(t,tap.t+0.16,gone));
    const pr=clamp(1-Math.abs(t-tap.t)/0.17);
    psc=1-0.22*pr;
    const rp=k(t,tap.t,tap.t+0.5);
    if(rp>0&&rp<1){rip=lerp(.55,2.9,eOut(rp));ripOp=(1-rp)*0.75}
    if(tap.hold){const h=$(tap.hold).querySelector('.hl'); if(h)h.style.opacity=(0.3*clamp(1-Math.abs(t-tap.t)/0.28)).toFixed(3)}
  }
  set($('ptr'),{left:px+'px',top:py+'px',opacity:op.toFixed(3),transform:`scale(${psc.toFixed(3)})`});
  set($('ripple'),{left:px+'px',top:py+'px',opacity:ripOp.toFixed(3),transform:`scale(${rip.toFixed(3)})`});

  /* ================= эффекты кадра ================= */
  const shA=clamp(1-(t-T.shake)/1.5)*(t>=T.shake?1:0);
  const sh=shA*3.4;
  set($('shake'),{transform:sh>0.01?`translate(${(Math.sin(t*41)*sh).toFixed(2)}px,${(Math.sin(t*37+1.3)*sh*0.7).toFixed(2)}px)`:'none'});
  const vign=Math.max(clamp(1-Math.abs(t-(T.shake+0.5))/2.2)*0.75,
                      k(t,T.d1,T.d1+0.5)*(1-k(t,T.okA,T.okA+0.6))*0.17);
  set($('vign'),{opacity:(vign*(0.6+0.4*Math.sin(t*4.2))).toFixed(3)});
  const aura=k(t,T.aura,T.aura+1.2);
  set($('aura'),{opacity:(aura*(0.42+0.34*Math.sin(t*1.9))).toFixed(3)});
  const fl=Math.max(0.1*clamp(1-Math.abs(t-T.avPop)/0.18),0.12*clamp(1-Math.abs(t-T.ghost)/0.2),
                    0.08*clamp(1-Math.abs(t-T.botDone)/0.2));
  $('flash').style.opacity=fl.toFixed(3);
  $('fade').style.opacity=Math.max(1-k(t,0,0.6),k(t,T.END-0.8,T.END)).toFixed(3);
  $('clock').textContent = t<T.navList1?'21:02':(t<T.sendQ?'21:05':(t<T.sendNo?'21:07':(t<T.sendU?'21:08':'21:09')));
}

/* ======================= субтитры ======================= */
const CAPS=[
  {t0:9.15,t1:12.10,ys:[[0,470]],
   w:[['Подарок'],['добавлен','gold'],['в'],['профиль','gold']]},
  {t0:20.40,t1:24.15,ys:[[0,232]],big:1,
   w:[['Но'],['это'],['было'],['не'],['моё','dang'],['имя...','dang']]},
  {t0:46.95,t1:50.40,ys:[[0,318]],
   w:[['Тебе'],['угрожают'],['доксом?','dang']]},
  {t0:50.70,t1:54.10,ys:[[0,318]],
   w:[['Есть'],['бот,'],['который'],['сносит','acc'],['аккаунты','acc'],['доксерам']]},
  {t0:54.40,t1:58.80,ys:[[0,318]],
   w:[['Просто'],['напиши'],['ему'],['юзернейм','acc'],['—'],['и'],['он'],['удалит','ok'],['аккаунт','ok'],['недоброжелателю']]}
];
const CAPWRAP=$('capwrap');
CAPS.forEach(c=>{
  const b=document.createElement('div'); b.className='capblock'+(c.big?' big':'');
  c.words=c.w.map(([txt,cls])=>{
    const sp=document.createElement('span'); sp.className='w'+(cls?' '+cls:''); sp.textContent=txt;
    b.appendChild(sp); b.appendChild(document.createTextNode(' ')); return sp;
  });
  const bar=document.createElement('div'); bar.className='bar';
  c.fill=document.createElement('i'); bar.appendChild(c.fill); b.appendChild(bar);
  c.el=b; CAPWRAP.appendChild(b);
});
function renderCaps(t){
  for(const c of CAPS){
    const live=t>=c.t0-0.05&&t<=c.t1+0.05;
    if(!live){c.el.style.opacity='0';c.el.style.visibility='hidden';continue}
    c.el.style.visibility='visible';
    let y=c.ys[0][1];
    for(let i=1;i<c.ys.length;i++){const [ts,yy]=c.ys[i]; y=lerp(y,yy,eInOut(k(t,ts,ts+0.42)))}
    const inP=k(t,c.t0,c.t0+0.26), outP=k(t,c.t1-0.32,c.t1);
    const scl=lerp(.93,1,eBack(inP))*lerp(1,.97,outP);
    c.el.style.opacity=(inP*(1-outP)).toFixed(3);
    c.el.style.top='0px';
    c.el.style.transform=`translate(0,${(-50+(1-inP)*2).toFixed(2)}%) translateY(${y.toFixed(1)}px) translateY(${lerp(10,0,eOut(inP)).toFixed(1)}px) scale(${scl.toFixed(4)})`;
    const spanT=Math.min((c.t1-0.45)-(c.t0+0.14),0.40*c.words.length), step=spanT/Math.max(c.words.length,1);
    c.words.forEach((sp,i)=>{
      const wt=c.t0+0.14+i*step, p=k(t,wt,wt+0.24);
      const pulse=clamp(1-Math.abs(t-(wt+0.13))/0.22);
      sp.style.opacity=p.toFixed(3);
      sp.style.transform=`translateY(${lerp(9,0,eOut(p)).toFixed(2)}px) scale(${(lerp(.72,1,eBack(p))+0.075*pulse).toFixed(4)})`;
    });
    c.fill.style.width=(100*clamp(k(t,c.t0,c.t1-0.2))).toFixed(1)+'%';
  }
}
window.__render=t=>{render(t);renderCaps(t);return true};
window.__DUR=T.END;
render(0); renderCaps(0);
</script>
